name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npx electron-vite build && npx electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-vite build && npx electron-builder --win --x64 --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: Choose the release tag
        id: release
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Inventory ${{ steps.release.outputs.tag }}
          make_latest: true
          files: installers/*
          body: |
            Download the installer for the computer you are using.

            Mac, Apple silicon: the file whose name ends in `mac-arm64.dmg`.
            Mac, Intel: the file whose name ends in `mac-x64.dmg`.
            Windows: the file whose name ends in `win-x64.exe`.

            On a Mac, open the dmg and drag Inventory to Applications. If macOS blocks the app, right-click it and choose Open.
            On Windows, run the setup file. If SmartScreen appears, choose More info, then Run anyway.
